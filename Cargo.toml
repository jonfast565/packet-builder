[package]
name = "packet_builder"
version = "0.1.1"
edition = "2024"
autoexamples = false

[lib]
name = "packet_builder"
path = "src/lib.rs"

[[bin]]
name = "packet_builder"
path = "src/main.rs"

[dependencies]
pest = "2.1.3"
pest_derive = "2.1.0"
ariadne = { version = "0.4", features = ["auto-color"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
