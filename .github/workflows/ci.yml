name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Toolchains for the generated parsers; the test suite compiles and runs
      # the generated code with each of them.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Node 22.18+ runs the generated TypeScript without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install Free Pascal, gfortran and GNAT
        run: sudo apt-get update && sudo apt-get install -y fpc gfortran gnat
      - name: Install Lua
        run: |
          sudo apt-get install -y lua5.4
          echo "LUA=lua5.4" >> "$GITHUB_ENV"
      # Swift comes with the runner image.
      - name: Check Swift
        run: swiftc --version
      # tshark 4.4 or later runs the generated Wireshark dissectors; Ubuntu's
      # own package is older, so it comes from the Wireshark PPA.
      - name: Install tshark
        run: |
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          sudo apt-get update
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          version=$(tshark --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "tshark $version"
          printf '4.4\n%s\n' "$version" | sort -V -C || { echo "tshark $version is older than 4.4"; exit 1; }

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          PB_REQUIRE_ALL: "1"
